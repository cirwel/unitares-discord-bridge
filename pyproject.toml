[project]
name = "unitares-discord-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.4",
    "websockets>=17.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
unitares-bridge = "bridge.bot:main"
